name: CI

on:
  push:
  pull_request:

jobs:
  # Fast logic checks: compile and run the host test suite in both modes.
  # This is what catches "shipped a regression" before it ever reaches a board.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PulseHSM host tests (both self-transition modes)
        run: bash test/run_tests.sh

  # Real cross-target builds: every example must compile for AVR and ESP32.
  # This is the guard that would have caught the non-compiling example.
  compile-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:avr:uno
            core: arduino:avr
            index: ""
          - fqbn: esp32:esp32:esp32
            core: esp32:esp32
            index: "--additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install core ${{ matrix.core }}
        run: |
          arduino-cli core update-index ${{ matrix.index }}
          arduino-cli core install ${{ matrix.core }} ${{ matrix.index }}

      - name: Make this repo available as a library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$GITHUB_WORKSPACE" "$HOME/Arduino/libraries/PulseHSM"

      - name: Compile every example for ${{ matrix.fqbn }}
        run: |
          set -e
          for sketch in examples/*/; do
            name="$(basename "$sketch")"
            echo "::group::$name on ${{ matrix.fqbn }}"
            arduino-cli compile --fqbn ${{ matrix.fqbn }} "$sketch"
            echo "::endgroup::"
          done
